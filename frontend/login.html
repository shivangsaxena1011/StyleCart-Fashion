<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Avenor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(18px);
            box-shadow: 0 26px 75px rgba(0,0,0,0.42);
        }

        .auth-container .logo {
            display: block;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .auth-container h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-container .subtitle {
            color: var(--muted);
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            transition: 0.25s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--maroon-light);
            box-shadow: 0 0 0 3px rgba(143,29,45,0.2);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--maroon-light), var(--maroon));
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(143,29,45,0.4);
        }

        .auth-links {
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
        }

        .auth-links a {
            color: var(--maroon-light);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .social-login {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .social-login button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .social-login button:hover {
            background: rgba(255,255,255,0.08);
        }

        @media (max-width: 576px) {
            .auth-container {
                padding: 32px 20px;
            }

            .auth-container h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <a href="index.html" class="logo">AVENOR</a>
            <h1>Welcome Back</h1>
            <p class="subtitle">Login to your account</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="auth-btn">Login</button>
            </form>

            <div class="auth-links">
                <a href="signup.html">Create an account</a> &middot; <a href="#">Forgot password?</a>
            </div>

            <div class="social-login">
                <button onclick="alert('Google login coming soon!')">Google</button>
                <button onclick="alert('Apple login coming soon!')">Apple</button>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const email = inputs[0].value.trim();
            const password = inputs[1].value;

            try {
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    alert('✅ Login successful!');
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert('❌ Login failed: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                // Fallback login for demo
                alert('✅ Server offline. Authenticated in Demo Mode.');
                localStorage.setItem('token', 'mock_demo_jwt_token');
                localStorage.setItem('user', JSON.stringify({ name: "Demo User", email: email, role: email.includes('admin') ? 'admin' : 'user' }));
                if (email.includes('admin')) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }
    </script>
</body>
</html>
